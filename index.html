<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PeopleOps · 인사관리</title><link rel="stylesheet" href="style.css"></head><body><div id="login" class="login-wrap" hidden><form id="loginform" class="login-card"><h2>◈ PeopleOps</h2><h3>인사관리 시스템</h3><p>관리자 아이디와 비밀번호를 입력하세요.</p><label for="username">관리자 아이디</label><input id="username" type="text" autocomplete="username" required maxlength="64"><label for="password">비밀번호</label><input id="password" type="password" minlength="1" maxlength="256" autocomplete="current-password" required><p id="loginerror" role="alert" class="error-line"></p><button id="loginbutton" type="submit">로그인</button><small>승인된 인사팀 담당자만 사용하세요.</small></form></div><div class="shell" id="shell" hidden><aside><h2>◈ PeopleOps</h2><p>인사관리 시스템</p><nav><button data-view="dashboard" class="selected">종합 대시보드</button><button data-view="employees">직원 명부</button><button data-view="certificates">자격증</button><button data-view="technical">기술등급</button><button data-view="licenses">보유 면허</button><button data-view="industries">업종 등록</button></nav><p class="muted">인증: 관리자 로그인</p></aside><main><div class="top"><div><h1 id="title">종합 대시보드</h1><p id="subtitle">D1 공용 데이터베이스</p></div><span id="identity">로그인 확인 중…</span><button id="logout" type="button">로그아웃</button></div><div class="notice">현재는 로그인 · 승인 권한 · 실제 데이터 <b>조회</b>를 검증하는 단계입니다. 직원 정보 수정은 다음 버전에서 활성화합니다. 실제 개인정보는 보안 검토 전까지 입력하지 마세요.</div><div id="body">로딩 중…</div></main></div><script src="app.js"></script></body></html>
