<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>PeopleOps | 인사관리</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="login"><div class="loginbox"><div class="brand">◈ PeopleOps</div><h1>인사관리 시스템</h1><p>관리자에게 발급받은 이메일과 비밀번호로 로그인하세요.</p><div id="setupHint" class="notice hidden">설정 전입니다. README에 따라 config.js를 설정하세요.</div><form id="loginForm"><label>이메일<input type="email" name="email" required autocomplete="username"></label><label>비밀번호<input type="password" name="password" required autocomplete="current-password"></label><button type="submit">로그인</button></form><div id="loginError" class="error"></div><small>로그인 승인을 받은 인사팀 직원만 접근할 수 있습니다.</small></div></div>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand">◈ PeopleOps</div><div class="hint">HR MANAGEMENT</div><nav id="nav"><button data-page="dashboard" class="active">▦ 종합 대시보드</button><button data-page="monthly">▤ 월별 입·퇴사</button><button data-page="employees">♙ 직원 명부</button><button data-page="certificates">♢ 자격증 관리</button><button data-page="technical">⚙ 기술인력 · 면허</button><button data-page="audit" class="admin-only hidden">◷ 변경 이력</button><button data-page="users" class="admin-only hidden">♧ 사용자 관리</button></nav><div class="sidefoot">로그인 계정<br><b id="who"></b><div id="role"></div><button id="logout" class="secondary">로그아웃</button></div></aside><main><header><div><h1 id="pageTitle">종합 대시보드</h1><p id="pageDesc">현재 직원 및 인사 정보</p></div><div class="topright"><span id="status"></span><button id="export" class="outline">직원 CSV 다운로드</button></div></header><div id="content"></div></main></div>
<div id="modal" class="overlay hidden"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle"></h2><button id="closeModal" class="x">✕</button></div><form id="editForm"><div id="formFields" class="fields"></div><footer><button type="button" id="cancelModal" class="outline">취소</button><button type="submit" id="submitModal">저장하기</button></footer></form></div></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script></body></html>
